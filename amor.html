<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Para Camilly ❤️</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body{
      height:100vh;
      overflow:hidden;
      background: linear-gradient(-45deg, #ff4d6d, #ff758f, #ff8fa3, #ffc2d1);
      background-size: 400% 400%;
      animation: bg 10s ease infinite;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
    }

    @keyframes bg{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }

    .card{
      width:90%;
      max-width:700px;
      padding:40px;
      border-radius:25px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(15px);
      text-align:center;
      color:white;
      box-shadow:0 0 40px rgba(0,0,0,0.2);
      animation: fade 2s ease;
      z-index:10;
    }

    @keyframes fade{
      from{
        opacity:0;
        transform:translateY(40px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    h1{
      font-size:3rem;
      margin-bottom:20px;
      text-shadow:0 0 15px rgba(255,255,255,0.5);
    }

    .typing{
      font-size:1.3rem;
      line-height:1.8;
      min-height:150px;
    }

    .heart{
      position:absolute;
      color:white;
      font-size:20px;
      animation: subir linear infinite;
      opacity:0.7;
    }

    @keyframes subir{
      from{
        transform:translateY(100vh) scale(0);
        opacity:0;
      }

      50%{
        opacity:0.8;
      }

      to{
        transform:translateY(-10vh) scale(1.5);
        opacity:0;
      }
    }

    .btn{
      margin-top:30px;
      padding:15px 35px;
      border:none;
      border-radius:40px;
      background:white;
      color:#ff4d6d;
      font-size:1rem;
      cursor:pointer;
      transition:0.3s;
      font-weight:bold;
    }

    .btn:hover{
      transform:scale(1.08);
      box-shadow:0 0 20px white;
    }

    .mensagem{
      margin-top:25px;
      font-size:1.2rem;
      opacity:0;
      transition:1s;
    }

    .mostrar{
      opacity:1;
    }

    audio{
      display:none;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Camilly ❤️</h1>

    <div class="typing" id="texto"></div>

    <button class="btn" onclick="mostrarMensagem()">
      Clique aqui ✨
    </button>

    <div class="mensagem" id="mensagem">
      "Na linha do tempo, o destino escreveu
Com letras douradas, você e eu<br>
Há quanto tempo eu esperava encontrar alguém assim
Que se encaixasse bem nos planos que um dia fiz pra mim, Você e eu"
      <br>
       Eu te amo Camilly Victoria ❤️
      <br>
      Ass: 23
    </div>
  </div>

  <script>
    const texto = "Entre bilhões de pessoas, Deus escreveu teu nome no meu caminho, e desde então meu coração entende coisas que palavras não explicam. Você não chegou por acaso chegou como destino...";
    
    let i = 0;
    const velocidade = 45;

    function escrever(){
      if(i < texto.length){
        document.getElementById("texto").innerHTML += texto.charAt(i);
        i++;
        setTimeout(escrever, velocidade);
      }
    }

    escrever();

    function mostrarMensagem(){
      document.getElementById("mensagem").classList.add("mostrar");
    }

    function criarCoracao(){
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "❤️";

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
      heart.style.fontSize = (Math.random() * 20 + 15) + "px";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }

    setInterval(criarCoracao, 250);
  </script>

</body>
</html>
