
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RDH Tech</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;

            font-family: Arial, Helvetica, sans-serif;
            background: #05080b;
            color: #fff;
        }

        .card {
            width: 100%;
            max-width: 430px;
            padding: 34px 24px 28px;

            text-align: center;

            border: 1px solid rgba(0, 229, 255, 0.28);
            border-radius: 26px;

            background: linear-gradient(
                180deg,
                #0b1116,
                #070b0f
            );

            box-shadow:
                0 18px 60px rgba(0, 0, 0, 0.55),
                0 0 35px rgba(0, 229, 255, 0.08);
        }

        .logo {
            width: 130px;
            height: 130px;
            object-fit: contain;
            margin-bottom: 18px;
            border-radius: 22px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 7px;
        }

        .subtitle {
            color: #aeb8bf;
            margin-bottom: 28px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            width: 100%;
            min-height: 62px;

            margin: 13px 0;

            border-radius: 16px;

            text-decoration: none;
            color: #fff;

            font-size: 18px;
            font-weight: 700;

            background: #10181d;

            border: 1px solid rgba(0, 229, 255, 0.20);

            transition: 0.18s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: #142127;
            border-color: rgba(0, 229, 255, 0.45);
        }

        .app-icon {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .footer {
            margin-top: 24px;
            color: #69757d;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <main class="card">

        <img src="logo.png" alt="RDH Tech" class="logo">

        <h1>RDH Tech</h1>

        <p class="subtitle">
            Manutenção e Suporte em Informática
        </p>

        <a
            class="btn"
            href="https://wa.me/5516994265713"
            target="_blank"
            rel="noopener noreferrer"
        >
            <img
                class="app-icon"
                src="logo-what.png"
                alt="WhatsApp"
            >
            WhatsApp
        </a>

        <a
            class="btn"
            href="https://instagram.com/rdh.tech"
            target="_blank"
            rel="noopener noreferrer"
        >
            <img
                class="app-icon"
                src="logo-insta.png"
                alt="Instagram"
            >
            Instagram
        </a>

        <div class="footer">
            Escolha uma opção para entrar em contato
        </div>

    </main>

</body>
</html>
