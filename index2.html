<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversa simulada ❤️</title>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
  background: #050505;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

.phone {
  width: 390px;
  height: 820px;
  max-height: 100vh;

  background: #0d0d0d;

  border-radius: 25px;

  overflow: hidden;

  position: relative;

  border: 1px solid #292929;

  box-shadow: 0 0 45px rgba(255,255,255,.08);
}


/* =========================
   TOPO
========================= */

.topbar {
  height: 66px;

  background: #111;

  display: flex;

  align-items: center;

  padding: 8px 12px;

  gap: 10px;

  border-bottom: 1px solid #292929;
}

.back {
  font-size: 34px;

  cursor: pointer;

  line-height: 1;
}

.avatar {
  width: 44px;
  height: 44px;

  border-radius: 50%;

  object-fit: cover;
}

.name {
  flex: 1;

  display: flex;

  align-items: center;

  min-width: 0;
}

.name strong {
  font-size: 15px;

  white-space: nowrap;
}

.actions,
.dots {
  font-size: 24px;

  color: #ddd;

  margin-left: 7px;
}


/* =========================
   CHAT
========================= */

.chat {
  height: calc(100% - 131px);

  padding: 18px 12px 25px;

  overflow-y: auto;

  background:
    radial-gradient(
      circle at 20% 20%,
      #191919 1px,
      transparent 1px
    ),
    radial-gradient(
      circle at 80% 70%,
      #191919 1px,
      transparent 1px
    ),
    #0b0b0b;

  background-size: 35px 35px;

  scroll-behavior: smooth;
}

.chat::-webkit-scrollbar {
  width: 4px;
}

.chat::-webkit-scrollbar-thumb {
  background: #444;

  border-radius: 10px;
}


/* =========================
   MENSAGENS
========================= */

.row {
  width: 100%;

  display: flex;

  margin: 9px 0;

  opacity: 0;

  transform: translateY(12px);

  transition: .3s ease;
}

.row.show {
  opacity: 1;

  transform: translateY(0);
}

.row.me {
  justify-content: flex-end;
}

.row.her {
  justify-content: flex-start;
}

.bubble {
  max-width: 80%;

  padding: 10px 13px;

  border-radius: 18px;

  font-size: 14px;

  line-height: 1.4;

  word-wrap: break-word;

  overflow-wrap: break-word;
}

.row.me .bubble {
  background: #fe2c55;

  border-bottom-right-radius: 5px;
}

.row.her .bubble {
  background: #262626;

  border-bottom-left-radius: 5px;
}


/* =========================
   RESPOSTA ESTILO TIKTOK
========================= */

.reply-message {
  position: relative;

  display: flex;

  flex-direction: column;

  align-items: flex-start;

  gap: 8px;

  max-width: 80%;

  padding-left: 12px;
}


/* LINHA VERTICAL */

.reply-message::before {
  content: "";

  position: absolute;

  left: 0;

  top: 2px;

  bottom: 2px;

  width: 4px;

  background: #777;

  border-radius: 4px;
}


/* BLOCO DA MENSAGEM RESPONDIDA */

.reply-box {
  background: #262626;

  border-radius: 14px;

  padding: 10px 14px;

  color: #aaa;

  font-size: 13px;

  line-height: 1.35;

  max-width: 100%;

  overflow: hidden;

  word-wrap: break-word;
}

.reply-box strong {
  color: #aaa;

  font-weight: normal;
}


/* MENSAGEM DA RESPOSTA */

.reply-content {
  background: #262626;

  border-radius: 18px;

  border-bottom-left-radius: 5px;

  padding: 10px 13px;

  font-size: 14px;

  line-height: 1.4;

  max-width: 100%;

  word-wrap: break-word;

  overflow-wrap: break-word;
}


/* =========================
   VÍDEO
========================= */

.video-wrap {
  width: 190px;

  height: 260px;

  border-radius: 12px;

  overflow: hidden;

  position: relative;

  background: #222;

  box-shadow: 0 5px 18px rgba(0,0,0,.5);

  flex-shrink: 0;
}

.video-wrap img {
  display: block;

  width: 100%;

  height: 100%;

  object-fit: cover;
}


/* CASO A CAPA NÃO CARREGUE */

.video-wrap.no-image {
  background:
    linear-gradient(
      145deg,
      #222,
      #171717
    );
}


/* BOTÃO PLAY */

.play {
  position: absolute;

  top: 50%;

  left: 50%;

  transform: translate(-50%, -50%);

  width: 58px;

  height: 58px;

  border-radius: 50%;

  background: rgba(0,0,0,.65);

  display: flex;

  justify-content: center;

  align-items: center;

  font-size: 23px;

  padding-left: 3px;

  pointer-events: none;
}


/* LABEL DO VÍDEO */

.video-label {
  position: absolute;

  bottom: 10px;

  left: 10px;

  background: rgba(0,0,0,.65);

  padding: 5px 9px;

  border-radius: 5px;

  font-size: 11px;

  pointer-events: none;
}


/* =========================
   CONTROLES
========================= */

.controls {
  height: 65px;

  position: absolute;

  bottom: 0;

  left: 0;

  width: 100%;

  background: #111;

  border-top: 1px solid #292929;

  display: flex;

  align-items: center;

  gap: 8px;

  padding: 10px;
}

.controls button {
  border: none;

  height: 42px;

  background: #fe2c55;

  color: white;

  font-weight: bold;

  border-radius: 12px;

  cursor: pointer;

  transition: .2s;
}

#next {
  flex: 1;
}

.controls button:hover {
  transform: scale(1.02);

  filter: brightness(1.1);
}

.secondary {
  width: 45px;

  background: #292929 !important;

  font-size: 20px;
}


/* =========================
   CELULAR
========================= */

@media (max-width: 500px) {

  body {
    align-items: stretch;
  }

  .phone {
    width: 100%;

    height: 100vh;

    border-radius: 0;

    border: none;
  }

}

</style>

</head>


<body>

<main class="phone">


  <!-- =========================
       TOPO
  ========================= -->

  <header class="topbar">

    <div class="back">
      ‹
    </div>


    <img
      class="avatar"
      src="R.C/image/depois_camilly.jpeg"
      alt="Camilly"
    >


    <div class="name">

      <!-- 🔥 193 NA FRENTE DO NOME -->

      <strong>c'amiis 🔥12</strong>

    </div>


    <div class="actions">
      ⌕
    </div>


    <div class="dots">
      •••
    </div>

  </header>



  <!-- =========================
       CONVERSA
  ========================= -->

  <section
    class="chat"
    id="chat"
  ></section>



  <!-- =========================
       CONTROLES
  ========================= -->

  <div class="controls">

    <button id="next">
      Próxima mensagem ❤️
    </button>


    <button
      id="restart"
      class="secondary"
    >
      ↻
    </button>

  </div>

</main>



<script>


/* =========================
   MENSAGENS
========================= */

const messages = [


  /* ELA — VÍDEO */

  {
    side: "her",

    video: true
  },


  /* VOCÊ */

  {
    side: "me",

    text: "Nossa Hungria slk muitooo bomm"
  },


  /* VOCÊ */

  {
    side: "me",

    text: "Vc tbm gosta de Hungria?"
  },


  /* ELA — RESPOSTA */

  {
    side: "her",

    reply: "Vc tbm gosta de Hungria?",

    text: "Simmm"
  },


  /* ELA */

  {
    side: "her",

    text: "lgc kakkakaka"
  },


  /* ELA */

  {
    side: "her",

    text:
      "Meu sonho é dirigir num civic g10 preto de noite escutando Hungria"
  },


  /* VOCÊ */

  {
    side: "me",

    text:
      "Meu sonho tbmm, nossa só de imaginar kkkkkkk"
  }

];



/* =========================
   ELEMENTOS
========================= */

const chat =
  document.getElementById("chat");

const next =
  document.getElementById("next");

const restart =
  document.getElementById("restart");


let i = 0;



/* =========================
   ADICIONAR MENSAGEM
========================= */

function addMessage(message) {

  const wrap =
    document.createElement("div");


  wrap.className =
    "row " + message.side;



  /* =========================
     VÍDEO
  ========================= */

  if (message.video) {

    const video =
      document.createElement("div");


    video.className =
      "video-wrap";


    const img =
      document.createElement("img");


    img.src ="R.C/image/capa-video.jpeg";


    img.alt = "";


    /* SE A CAPA NÃO EXISTIR */

    img.onerror = function() {

      this.style.display =
        "none";

      video.classList.add(
        "no-image"
      );

    };


    const play =
      document.createElement("div");


    play.className =
      "play";


    play.textContent =
      "▶";


    const label =
      document.createElement("div");


    label.className =
      "video-label";


    label.textContent =
      "vídeo";


    video.appendChild(img);

    video.appendChild(play);

    video.appendChild(label);


    wrap.appendChild(video);

  }



  /* =========================
     RESPOSTA
  ========================= */

  else if (message.reply) {

    const replyMessage =
      document.createElement("div");


    replyMessage.className =
      "reply-message";


    /* BLOCO DA MENSAGEM RESPONDIDA */

    const replyBox =
      document.createElement("div");


    replyBox.className =
      "reply-box";


    const replyText =
      document.createElement("span");


    replyText.innerHTML =
      "<strong>Você:</strong> " +
      message.reply;


    replyBox.appendChild(
      replyText
    );


    /* RESPOSTA DELA */

    const response =
      document.createElement("div");


    response.className =
      "reply-content";


    response.textContent =
      message.text;


    replyMessage.appendChild(
      replyBox
    );


    replyMessage.appendChild(
      response
    );


    wrap.appendChild(
      replyMessage
    );

  }



  /* =========================
     MENSAGEM NORMAL
  ========================= */

  else {

    const bubble =
      document.createElement("div");


    bubble.className =
      "bubble";


    bubble.textContent =
      message.text;


    wrap.appendChild(
      bubble
    );

  }



  /* ADICIONA NO CHAT */

  chat.appendChild(
    wrap
  );


  /* ANIMAÇÃO */

  requestAnimationFrame(() => {

    wrap.classList.add(
      "show"
    );

  });


  /* ROLA PARA BAIXO */

  chat.scrollTop =
    chat.scrollHeight;

}



/* =========================
   PRÓXIMA MENSAGEM
========================= */

next.addEventListener(
  "click",
  () => {

    if (i < messages.length) {

      addMessage(
        messages[i]
      );

      i++;


      if (
        i === messages.length
      ) {

        next.textContent =
          "Fim da conversa ❤️";

      }

    }

  }
);



/* =========================
   REINICIAR
========================= */

restart.addEventListener(
  "click",
  () => {

    i = 0;

    chat.innerHTML = "";

    next.textContent =
      "Próxima mensagem ❤️";

  }
);

</script>

</body>
</html>
